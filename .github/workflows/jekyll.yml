name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl /LJT-Homepage
        env:
          JEKYLL_ENV: production

      - name: Audit memory-sourced populated content
        run: |
          set -euo pipefail

          test "$(find _publications -type f -name '*.md' | wc -l)" -eq 6

          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )

          for title in "${titles[@]}"; do
            grep -FRq "$title" _publications
            grep -Fq "$title" _site/about/index.html
            grep -Fq "$title" _site/publications/index.html
            grep -Fq "$title" _site/cv/index.html
          done

          forbidden=(
            "GitHub University"
            "Professor Hub"
            "Professor Git"
            "Version Control Theory"
            "Hong Kong"\n            "profile.png"
            "Python-based"
            "Deep-learning experiment design"
            "Foundation-model evaluation"
            "Empirical analysis of model behavior"
            "Representation analysis"
            "large-scale verifiable reasoning data"\n            "vision-language model hallucination"
            "internal representations"\n            "language-model truthfulness"
            "probes trained"\n            "vision-encoder"
            "contrastive learning"
            "January 2025"
            "January 2024"
            "January 2023"
            "2025-01-01"
            "2025-01-02"
            "2024-01-01"
            "2024-01-02"
            "2023-01-01"
            "2023-01-02"
          )

          populated_files=(
            "_config.yml"
            "_data/navigation.yml"
            "_pages/about.md"
            "_pages/experience.md"
            "_pages/skills.md"
            "_pages/cv.md"
          )
          while IFS= read -r publication_file; do
            populated_files+=("$publication_file")
          done < <(find _publications -type f -name '*.md' | sort)

          for phrase in "${forbidden[@]}"; do
            ! grep -RFq "$phrase" "${populated_files[@]}"
          done

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: https://oconvtzopmci.github.io/LJT-Homepage/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
