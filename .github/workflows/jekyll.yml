name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl /LJT-Homepage
        env:
          JEKYLL_ENV: production

      - name: Verify native home layout and publications page
        run: |
          set -euo pipefail
          test ! -e index.html
          test -f _layouts/home.html
          grep -Fq 'site.publications' _layouts/home.html
          grep -Fq 'Selected Publications' _layouts/home.html
          test -f _site/publications/index.html

          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )

          cat > index.html <<'EOF'
          ---
          layout: home
          title: Junteng Liu
          author_profile: true
          ---
          EOF

          bundle exec jekyll build \
            --baseurl /LJT-Homepage \
            --destination _home_layout_test \
            > /tmp/home-layout-build.log 2>&1
          test -f _home_layout_test/index.html

          for title in "${titles[@]}"; do
            grep -Fq "$title" _home_layout_test/index.html
            grep -Fq "$title" _site/publications/index.html
          done

          rm index.html
          rm -rf _home_layout_test

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: https://oconvtzopmci.github.io/LJT-Homepage/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
