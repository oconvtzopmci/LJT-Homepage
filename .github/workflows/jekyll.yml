name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl /LJT-Homepage
        env:
          JEKYLL_ENV: production

      - name: Verify publication and page content
        run: |
          set -euo pipefail

          test "$(find _publications -type f -name '*.md' | wc -l)" -eq 6

          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )

          for title in "${titles[@]}"; do
            grep -FRq "$title" _publications
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
            grep -Fq "$title" _site/cv/index.html
          done

          test ! -e _pages/experience.md
          test ! -e _pages/skills.md

          grep -Fq "Junteng Liu" _config.yml
          grep -Fq "HKUST NLP Group" _config.yml
          grep -Fq "jliugi@connect.ust.hk" _config.yml
          grep -Fq "Vicent0205" _config.yml
          grep -Fq "tbK9jl4AAAAJ" _config.yml
          grep -Fq "junteng88716710" _config.yml

          grep -Fq "MINIMAX" _pages/about.md
          grep -Fq "Tencent WXG" _pages/about.md
          grep -Fq "Shanghai AI Lab" _pages/about.md
          grep -Fq "Zifei Shan" _pages/about.md
          grep -Fq "Prof. Yu Cheng" _pages/about.md
          grep -Fq "Zhiyuan Honor Scholarship" _pages/about.md
          grep -Fq "LLM Reasoning" _pages/about.md
          grep -Fq "Reinforcement Learning" _pages/about.md
          grep -Fq "Hallucination" _pages/about.md
          grep -Fq "Interpretability" _pages/about.md
          grep -Fq "Hong Kong" _pages/about.md || true

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: https://oconvtzopmci.github.io/LJT-Homepage/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
